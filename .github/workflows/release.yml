name: release

# Builds, signs and publishes a version: images, gateway binaries and charts.
#
# - release-please calls it when it creates a release. Its tag does not
#   trigger "push: tags" here: GitHub starts no workflow for events made
#   with the workflow's own GITHUB_TOKEN, which is how v0.1.0 got a release
#   and no artifacts.
# - A maintainer pushing a version tag starts it directly.
# - Actions → release → Run workflow (or gh workflow run release.yml -f
#   tag=v0.1.0) builds an existing tag again.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: version tag to release, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: version tag to release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

# One run per tag; a second one waits and then publishes the same bytes again.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  tag:
    name: resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a version tag: $TAG"; exit 1; }
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")" || { echo "::error::tag $TAG does not exist"; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "releasing $TAG at $commit"

  images:
    name: image ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing with Sigstore
      attestations: write   # SLSA build provenance
    strategy:
      matrix:
        include:
          - name: stratum-gateway
            context: gateway
          - name: stratum-control-plane
            context: control-plane/dashboard
          - name: stratum-migrations
            context: control-plane/migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.commit }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.tag.outputs.tag }}
            COMMIT=${{ needs.tag.outputs.commit }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: gateway binaries
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: write       # upload release assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.mod
          # Without this the runner's cached Go can be an older patch release
          # that still has known standard library vulnerabilities.
          check-latest: true
      - name: build
        working-directory: gateway
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -X main.version=${TAG} -X main.commit=${COMMIT}" \
              -o "../dist/stratum-gateway_${TAG}_${os}_${arch}${ext}" ./cmd/stratum-gateway
          done
          cd ../dist && sha256sum stratum-gateway_* > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/stratum-gateway_*
      - name: upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    needs: [tag, images]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.commit }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0 # same Helm in CI and in releases
      # cosign reads the Docker credentials, not Helm's: without this it
      # cannot fetch the chart it just pushed while the package is private.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: package and push to ghcr.io (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ needs.tag.outputs.version }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in stratum-gateway stratum-control-plane; do
            helm package "deploy/helm/${chart}" --version "$version" --app-version "$version" -d dist
            helm push "dist/${chart}-${version}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log
            digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
            [ -n "$digest" ] || { echo "::error::no digest in the helm push output for ${chart}"; exit 1; }
            cosign sign --yes "ghcr.io/${OWNER}/charts/${chart}@${digest}"
          done
