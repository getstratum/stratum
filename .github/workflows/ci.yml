name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway (Go)
    runs-on: ubuntu-latest
    services:
      # Real Valkey for the shared quota tests (the Lua script runs server-side).
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.mod
          # Without this the runner's cached Go can be an older patch release
          # that still has known standard library vulnerabilities.
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: test (race)
        env:
          STRATUM_TEST_VALKEY_URL: redis://localhost:6379/15
          USAGE_EXAMPLES_DIR: ${{ runner.temp }}/usage-batches
        run: mkdir -p "$USAGE_EXAMPLES_DIR" && go test -race -count=1 -coverprofile=coverage.out ./...
      - name: usage batches the gateway sends match the contract
        run: >-
          pipx run --spec check-jsonschema==0.33.0 check-jsonschema
          --schemafile ../api/usage/v1/usage-batch.schema.json "$RUNNER_TEMP"/usage-batches/*.json
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: reproducible build
        # Two builds from the same tree in different directories must be
        # byte-identical; this is what lets anyone verify a released binary.
        run: |
          build() { CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "$1" ./cmd/stratum-gateway; }
          build /tmp/a/stratum-gateway
          cp -r . /tmp/copy && (cd /tmp/copy && build /tmp/b/stratum-gateway)
          sha256sum /tmp/a/stratum-gateway /tmp/b/stratum-gateway
          cmp /tmp/a/stratum-gateway /tmp/b/stratum-gateway

  contract:
    name: sync contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.33.0
      - run: check-jsonschema --check-metaschema api/sync/v2/sync-response.schema.json
      - run: check-jsonschema --schemafile api/sync/v2/sync-response.schema.json api/sync/v2/examples/*.json
      - run: check-jsonschema --check-metaschema api/usage/v1/usage-batch.schema.json
      - run: check-jsonschema --schemafile api/usage/v1/usage-batch.schema.json api/usage/v1/examples/*.json

  control-plane:
    name: control plane (Next.js)
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the migrations and the sync endpoint's queries.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum
          POSTGRES_DB: stratum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stratum" --health-interval 2s --health-timeout 2s --health-retries 15
    defaults:
      run:
        working-directory: control-plane/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: migrations
        working-directory: control-plane
        env:
          PGHOST: localhost
          PGUSER: stratum
          PGPASSWORD: stratum
          PGDATABASE: stratum
        run: |
          sh migrations/migrate.sh migrations
          # migrate.sh skips applied files; re-run the newest directly to
          # prove it is idempotent, as every migration must be.
          psql -X -q -v ON_ERROR_STOP=1 -f "$(ls migrations/*.sql | sort | tail -1)"
      - name: tests against PostgreSQL (sync, console access control)
        env:
          DATABASE_URL: postgres://stratum:stratum@localhost:5432/stratum
          SYNC_EXAMPLES_DIR: ${{ runner.temp }}/sync-responses
        run: mkdir -p "$SYNC_EXAMPLES_DIR" && npm test
      - name: sync responses from the tests match the contract
        run: >-
          pipx run --spec check-jsonschema==0.33.0 check-jsonschema
          --schemafile ../../api/sync/v2/sync-response.schema.json "$RUNNER_TEMP"/sync-responses/*.json
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  console-e2e:
    name: console functional test (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum
          POSTGRES_DB: stratum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stratum" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://stratum:stratum@localhost:5432/stratum
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            control-plane/dashboard/package-lock.json
            control-plane/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: control-plane/dashboard
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: control-plane/e2e
      - name: migrations
        working-directory: control-plane
        env:
          PGHOST: localhost
          PGUSER: stratum
          PGPASSWORD: stratum
          PGDATABASE: stratum
        run: sh migrations/migrate.sh migrations
      - name: console, gateway and mock LLM; then the browser test
        run: control-plane/e2e/run-local.sh

  images:
    name: container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: base images pinned by digest
        run: scripts/pin-images.sh --check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: migrations image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: control-plane/migrations
          push: false
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations
      - name: gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: control plane image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: control-plane/dashboard
          push: false
          load: true
          tags: stratum-control-plane:ci
          cache-from: type=gha,scope=cp
          cache-to: type=gha,mode=max,scope=cp
      # stratum-admin is how the first Owner is created: it has to start in
      # the image, with every module it imports. Without a command it loads
      # them all and prints its usage.
      - name: stratum-admin starts in the control plane image
        run: |
          out=$(docker run --rm stratum-control-plane:ci node scripts/stratum-admin.mjs 2>&1 || true)
          echo "$out"
          case "$out" in usage:*) ;; *) echo "::error::stratum-admin did not start in the image"; exit 1 ;; esac

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0 # same Helm in CI and in releases
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: helm lint
        run: |
          for chart in deploy/helm/stratum-gateway deploy/helm/stratum-control-plane; do
            for v in "$chart"/ci/*-values.yaml; do
              helm lint --strict "$chart" -f "$v"
            done
          done
      - name: render and validate against Kubernetes schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          for chart in deploy/helm/stratum-gateway deploy/helm/stratum-control-plane; do
            for v in "$chart"/ci/*-values.yaml; do
              helm template stratum "$chart" -f "$v" \
                | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
                    -kubernetes-version 1.29.0 -skip ServiceMonitor
            done
          done
      # The chart refuses values that would fail at run time.
      - name: control plane chart refuses incomplete values
        run: |
          refuses() {
            if helm template stratum deploy/helm/stratum-control-plane "$@" >/dev/null 2>&1; then
              echo "::error::accepted: $*"; exit 1
            fi
          }
          refuses
          refuses --set existingSecret=s --set replicaCount=1
          refuses --set existingSecret=s --set console.modelCatalogUrl=http://example.com/models.json
          refuses --set existingSecret=s --set 'sidecars[0].name=proxy' --set 'sidecars[0].image=x'

  gcp-kit:
    name: GCP reference deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: terraform fmt and validate
        working-directory: deploy/gcp/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: shellcheck
        run: shellcheck -x -S warning deploy/gcp/scripts/*.sh
      - name: mock provider builds
        working-directory: deploy/gcp/mock-llm
        run: go vet ./... && go build ./...
      - name: render and validate manifests (core and GKE CRDs)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          export NAMESPACE=stratum HOST=203-0-113-10.sslip.io CERT_MAP=m EDGE_IP_NAME=ip SSL_POLICY=tls \
            ARMOR_API=a ARMOR_CONSOLE=c ARMOR_SYNC=s CP_IMAGE=r/cp@sha256:0 MOCK_IMAGE=r/m@sha256:0 \
            PROXY_IMAGE=p:1 PSQL_IMAGE=postgres:16-alpine K6_IMAGE=grafana/k6:1.0.0 SQL_CONNECTION_NAME=p:r:i \
            SQL_DATABASE=stratum JOB_NAME=j SQL_COMMAND='["true"]' SQL_CONFIGMAP=c RATE=1 DURATION=1m \
            MAX_ERROR_RATE=0 VALKEY_IP=10.0.0.1
          mkdir -p /tmp/rendered
          for f in deploy/gcp/k8s/*.yaml; do envsubst < "$f" > "/tmp/rendered/$(basename "$f")"; done
          ! grep -n '${' /tmp/rendered/*.yaml
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered/*.yaml

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
