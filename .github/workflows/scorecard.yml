name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: read-all

jobs:
  analysis:
    # Scorecard publishing only works on public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2.4.0 pulled its image from gcr.io, which no longer serves it;
      # v2.4.1 and later use ghcr.io.
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
