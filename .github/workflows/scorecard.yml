name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: read-all

jobs:
  analysis:
    # Scorecard publishing only works on public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2.4.0 pulled its image from gcr.io, which no longer serves it;
      # v2.4.1 and later use ghcr.io.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
