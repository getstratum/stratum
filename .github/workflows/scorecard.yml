name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: read-all

jobs:
  analysis:
    # Scorecard publishing only works on public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # v2.4.0 pulled its image from gcr.io, which no longer serves it;
      # v2.4.1 and later use ghcr.io.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: results.sarif
