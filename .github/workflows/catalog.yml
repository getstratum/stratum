name: catalog

# A change to the model catalog alone (catalog/models.json, often made by
# the Catalogador of stratum-ops) is checked here, in seconds: the feed is
# parsed as every control plane parses it. ci.yml skips such a change.
on:
  pull_request:
    paths: ['catalog/**']
  push:
    branches: [main]
    paths: ['catalog/**']

permissions:
  contents: read

jobs:
  feed:
    name: catalog feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --no-warnings catalog/check.mjs
