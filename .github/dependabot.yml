version: 2
updates:
  - package-ecosystem: gomod
    directory: /gateway
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/gateway, /control-plane/dashboard]
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /control-plane/dashboard
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
