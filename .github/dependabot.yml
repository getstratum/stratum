version: 2
# Major version upgrades (Next.js, React, Tailwind, Node...) need a planned
# migration and are done by hand in their own PR; Dependabot only proposes
# minor and patch updates, plus security fixes.
updates:
  - package-ecosystem: gomod
    directory: /gateway
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/gateway, /control-plane/dashboard]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /control-plane/dashboard
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /control-plane/e2e
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Actions are pinned by commit SHA (with the version in a comment, which
  # Dependabot keeps updated). A release must be two weeks old before it is
  # proposed, so a compromised or broken release has time to be noticed.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
