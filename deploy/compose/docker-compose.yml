# Local development stack: PostgreSQL, control plane and gateway.
# This is a single-node setup for development and evaluation. It is NOT a
# high-availability deployment.
#
#   cp deploy/compose/.env.example deploy/compose/.env    # fill in the secrets
#   make up                                               # postgres + control plane
#
# Create your organization and its first console account (a new installation
# is empty; the command prints a password once):
#
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env \
#     exec control-plane node scripts/stratum-admin.mjs create-owner \
#     --email you@example.com --org-name "Your company"
#
# Then sign in at http://localhost:3000 (the first sign-in asks you to set up
# the second factor with an authenticator app), register a gateway instance, put the
# returned sync token and instance id in .env, and start the gateway:
#
#   docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d gateway

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: stratum
      POSTGRES_USER: stratum
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratum -d stratum"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: stratum
      PGDATABASE: stratum
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ../../control-plane/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Applies each migration once, tracked in schema_migrations.
    command: ["sh", "/migrations/migrate.sh", "/migrations"]

  control-plane:
    build:
      context: ../../control-plane/dashboard
      args:
        NEXT_PUBLIC_GATEWAY_URL: "http://localhost:20128"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://stratum:${POSTGRES_PASSWORD}@postgres:5432/stratum"
      # Session cookies are Secure. Browsers accept them on http://localhost;
      # set SECURE_COOKIES=false only to reach the console over plain HTTP
      # from another host, on a network you trust.
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      STRATUM_ENCRYPTION_KEY: "${STRATUM_ENCRYPTION_KEY:?set STRATUM_ENCRYPTION_KEY in .env (openssl rand -hex 32)}"
      STRATUM_SYNC_INTERVAL_S: "30"
      GATEWAY_INTERNAL_URL: "http://gateway:20128"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: ../../gateway
    restart: unless-stopped
    profiles: ["gateway"]
    read_only: true
    environment:
      STRATUM_CP_URL: "http://control-plane:3000"
      STRATUM_CP_ALLOW_HTTP: "true"          # local network only; use https everywhere else
      STRATUM_SYNC_TOKEN: "${STRATUM_SYNC_TOKEN:?register a gateway instance first}"
      STRATUM_INSTANCE_ID: "${STRATUM_INSTANCE_ID:?register a gateway instance first}"
      STRATUM_SNAPSHOT_KEY: "${STRATUM_SNAPSHOT_KEY:?set STRATUM_SNAPSHOT_KEY in .env (openssl rand -hex 32)}"
      STRATUM_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      # One gateway counts quotas exactly on its own. If you run several,
      # share the counters through Valkey (see README, "Quotas across replicas"):
      # STRATUM_VALKEY_URL: "redis://valkey:6379/0"
    volumes:
      - gateway-state:/var/lib/stratum
    ports:
      - "20128:20128"
      - "127.0.0.1:9090:9090"
    stop_grace_period: 2m

volumes:
  postgres-data:
  gateway-state:
