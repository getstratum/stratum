{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts needs at least one host when ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stratum-cp.fullname" . }}
  labels:
    {{- include "stratum-cp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (default (list (dict "path" "/" "pathType" "Prefix")) (index . "paths")) }}
          - path: {{ default "/" (index . "path") }}
            pathType: {{ default "Prefix" (index . "pathType") }}
            backend:
              service:
                name: {{ include "stratum-cp.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
