{{- if .Values.demo.enabled }}
{{- $d := .Values.demo }}
{{- $console := printf "http://%s" (include "stratum.subFullname" (dict "name" "control-plane" "root" .)) }}
{{- $gateway := printf "http://%s" (include "stratum.subFullname" (dict "name" "gateway" "root" .)) }}
{{- $mock := printf "%s-mock-llm" .Release.Name }}
{{- $env := printf `- name: DATABASE_URL
  valueFrom: { secretKeyRef: { name: %s, key: DATABASE_URL } }
- name: STRATUM_ENCRYPTION_KEY
  valueFrom: { secretKeyRef: { name: %s, key: STRATUM_ENCRYPTION_KEY } }
- { name: STRATUM_CP_URL, value: %q }
- { name: STRATUM_GATEWAY_URL, value: %q }
- { name: STRATUM_DEMO_MOCK_URL, value: %q }` .Values.secrets.controlPlane .Values.secrets.controlPlane $console $gateway (printf "http://%s:8080" $mock) }}
{{- $mounts := `- { name: demo, mountPath: /app/demo, readOnly: true }
- { name: tmp, mountPath: /tmp }` }}
# DEMO ONLY: a mock LLM in place of real providers, and the demo
# organization (files/demo, the same as deploy/demo).
apiVersion: v1
kind: Service
metadata:
  name: {{ $mock }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
spec:
  selector: {{- include "stratum.select" (dict "name" "mock-llm" "root" .) | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $mock }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "stratum.select" (dict "name" "mock-llm" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stratum.select" (dict "name" "mock-llm" "root" .) | nindent 8 }}
        app.kubernetes.io/part-of: stratum
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- include "stratum.podIdentity" (dict "uid" 65532 "root" .) | nindent 8 }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mock-llm
          image: {{ include "stratum.image" (dict "image" $d.mockLlm.image "tag" $d.mockLlm.tag "root" .) | quote }}
          env:
            - { name: MOCK_USAGE, value: request }
            # Engineering's policy caps answers at 8,192 output tokens.
            - { name: MOCK_MAX_COMPLETION_TOKENS, value: "600" }
            - { name: MOCK_LATENCY_MS, value: "250" }
            - { name: MOCK_CHUNK_INTERVAL_MS, value: "40" }
            # Its MCP server asks for it; the console keeps it (setup.mjs).
            - { name: MOCK_MCP_TOKEN, value: demo-mcp-token }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          resources: {{- toYaml $d.mockLlm.resources | nindent 12 }}
          securityContext: {{- include "stratum.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-demo
  labels: {{- include "stratum.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/demo/*").AsConfig | nindent 2 }}
---
# The demo organization, then today's traffic through the gateway. Safe to
# run again: it adds what is missing and keeps what was changed. A new Job
# each revision (a Job cannot be changed).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-demo-{{ .Release.Revision }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "stratum.select" (dict "name" "demo" "root" .) | nindent 8 }}
        app.kubernetes.io/part-of: stratum
        # It talks to the console, PostgreSQL and the gateway like they do.
        stratum.io/console-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- include "stratum.podIdentity" (dict "uid" 1000 "root" .) | nindent 8 }}
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # The console's pods run the migrations before they answer.
        {{- include "stratum.waitFor" (dict "name" "wait-console" "url" (printf "%s/api/healthz" $console) "root" .) | nindent 8 }}
        - name: setup
          image: {{ include "stratum.consoleImage" . | quote }}
          command: [node, /app/demo/setup.mjs]
          env: {{- $env | nindent 12 }}
          resources: {{- toYaml $d.resources | nindent 12 }}
          securityContext: {{- include "stratum.containerSecurity" . | nindent 12 }}
          volumeMounts: {{- $mounts | nindent 12 }}
        {{- if $d.traffic }}
        # The gateway serves once it has synced the registration above.
        {{- include "stratum.waitFor" (dict "name" "wait-gateway" "url" (printf "%s/readyz" $gateway) "root" .) | nindent 8 }}
        {{- end }}
      containers:
        - name: traffic
          image: {{ include "stratum.consoleImage" . | quote }}
          {{- if $d.traffic }}
          command: [node, /app/demo/traffic.mjs]
          {{- else }}
          command: [node, -e, "console.log('demo ready')"]
          {{- end }}
          env: {{- $env | nindent 12 }}
          resources: {{- toYaml $d.resources | nindent 12 }}
          securityContext: {{- include "stratum.containerSecurity" . | nindent 12 }}
          volumeMounts: {{- $mounts | nindent 12 }}
      volumes:
        - name: demo
          configMap: { name: {{ .Release.Name }}-demo }
        - { name: tmp, emptyDir: {} }
{{- end }}
