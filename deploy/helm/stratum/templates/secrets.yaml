{{- include "stratum.validate" . -}}
{{- $mode := .Values.secrets.mode }}
{{- if ne $mode "existing" }}
{{- $s := .Values.secrets }}
{{- $cpOn := (index .Values "control-plane").enabled }}
{{- $pgHere := or (ne .Values.postgresql.mode "external") (and $cpOn (eq $mode "generate")) }}
{{- /* What a Secret holds now, if the chart made it before: kept as it is. */}}
{{- $old := dict }}
{{- range $name := list $s.controlPlane $s.gateway $s.postgresql $s.valkey }}
{{- $found := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $_ := set $old $name (($found | default dict).data | default dict) }}
{{- end }}
{{- $hex := dict }}
{{- range $k := list "pg" "enc" "token" "snap" "valkey" "instance" }}
{{- $_ := set $hex $k (sha256sum (printf "%s-%s-%s" (randAlphaNum 64) $k now)) }}
{{- end }}
{{- $keep := "helm.sh/resource-policy: keep" }}
{{- /* PostgreSQL's user, first: the console's DATABASE_URL is made from it. */}}
{{- $pgPassword := "stratum-demo" }}
{{- if eq $mode "generate" }}
{{- $prev := index $old $s.postgresql }}
{{- $pgPassword = $prev.password | default "" | b64dec | default (substr 0 32 $hex.pg) }}
{{- end }}
{{- if $pgHere }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.postgresql }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    {{ $keep }}
type: kubernetes.io/basic-auth
stringData:
  username: stratum
  password: {{ $pgPassword | quote }}
---
{{- end }}
{{- if $cpOn }}
{{- $prev := index $old $s.controlPlane }}
{{- $db := printf "postgresql://stratum:%s@%s:%v/%s" $pgPassword (include "stratum.databaseHost" .) (.Values.postgresql.external.port | default 5432) (first .Values.postgresql.databases) }}
{{- if eq .Values.postgresql.mode "external" }}{{ $db = printf "%s?sslmode=%s" $db .Values.postgresql.external.sslmode }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.controlPlane }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    {{ $keep }}
type: Opaque
stringData:
  {{- if eq $mode "demo" }}
  # Fixed and public, as deploy/demo: DEMO ONLY.
  DATABASE_URL: {{ $db | quote }}
  STRATUM_ENCRYPTION_KEY: "0d0e0f0a0b0c0d0e0f0a0b0c0d0e0f0a0b0c0d0e0f0a0b0c0d0e0f0a0b0c0d0e"
  {{- else }}
  DATABASE_URL: {{ $prev.DATABASE_URL | default "" | b64dec | default $db | quote }}
  STRATUM_ENCRYPTION_KEY: {{ $prev.STRATUM_ENCRYPTION_KEY | default "" | b64dec | default $hex.enc | quote }}
  {{- end }}
---
{{- end }}
{{- $valkeyPassword := "" }}
{{- if .Values.valkey.enabled }}
{{- $prev := index $old $s.valkey }}
{{- $valkeyPassword = $prev.default | default "" | b64dec | default (substr 0 32 $hex.valkey) }}
{{- if eq $mode "demo" }}{{ $valkeyPassword = "stratum-demo-valkey" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.valkey }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    {{ $keep }}
type: Opaque
stringData:
  default: {{ $valkeyPassword | quote }}
---
{{- end }}
{{- $prev := index $old $s.gateway }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.gateway }}
  labels: {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    {{ $keep }}
type: Opaque
stringData:
  {{- if eq $mode "demo" }}
  # Fixed and public, as deploy/demo; files/demo/setup.mjs registers this
  # gateway with them. DEMO ONLY.
  STRATUM_INSTANCE_ID: "dp_00000000000000000000000000000001"
  STRATUM_SYNC_TOKEN: "dp_sync_ec04306ae2ed29a95834cb9b70b9d7f0a8698db0df6f19ff70b925c8aed0cb29"
  STRATUM_SNAPSHOT_KEY: "a1a2a3a4a5a6a7a8a9b0b1b2b3b4b5b6b7b8b9c0c1c2c3c4c5c6c7c8c9d0d1d2"
  {{- else }}
  # The bootstrap Job registers this gateway in the console with them.
  STRATUM_INSTANCE_ID: {{ $prev.STRATUM_INSTANCE_ID | default "" | b64dec | default (printf "dp_%s" (substr 0 32 $hex.instance)) | quote }}
  STRATUM_SYNC_TOKEN: {{ $prev.STRATUM_SYNC_TOKEN | default "" | b64dec | default (printf "dp_sync_%s" $hex.token) | quote }}
  STRATUM_SNAPSHOT_KEY: {{ $prev.STRATUM_SNAPSHOT_KEY | default "" | b64dec | default $hex.snap | quote }}
  {{- end }}
  {{- if $valkeyPassword }}
  STRATUM_VALKEY_PASSWORD: {{ $valkeyPassword | quote }}
  {{- end }}
{{- end }}
