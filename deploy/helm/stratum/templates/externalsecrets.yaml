{{- /*
  An ExternalSecret per Secret this installation reads (values.yaml,
  externalSecrets): the console's when it runs here, the database's when
  the chart runs it, Valkey's when it is on; the gateway's always (its
  Valkey password only with Valkey). Stratum Enterprise's chart adds its own.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- if not $es.secretStoreRef.name }}
{{- fail "externalSecrets.secretStoreRef.name: the SecretStore or ClusterSecretStore to read from" }}
{{- end }}
{{- $valkey := .Values.valkey.enabled }}
{{- $want := dict
  "stratum-control-plane" (index .Values "control-plane").enabled
  "stratum-gateway" true
  "stratum-postgresql" (or (ne .Values.postgresql.mode "external") .Values.backup.enabled)
  "stratum-valkey" $valkey }}
{{- range $name, $data := $es.secrets }}
{{- if (hasKey $want $name | ternary (get $want $name) true) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels: {{- include "stratum.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    {{- if eq $name "stratum-postgresql" }}
    template:
      type: kubernetes.io/basic-auth
    {{- end }}
  data:
    {{- range $key, $ref := $data }}
    {{- $parts := splitList "#" $ref }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ index $parts 0 }}
        {{- if gt (len $parts) 1 }}
        property: {{ index $parts 1 }}
        {{- end }}
    {{- end }}
    {{- if and (eq $name "stratum-gateway") $valkey }}
    {{- $vp := splitList "#" (index $es.secrets "stratum-valkey" "default") }}
    - secretKey: STRATUM_VALKEY_PASSWORD
      remoteRef:
        key: {{ index $vp 0 }}
        {{- if gt (len $vp) 1 }}
        property: {{ index $vp 1 }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
