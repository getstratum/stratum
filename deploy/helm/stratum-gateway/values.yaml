# Stratum gateway — values for a highly available deployment.
#
# Defaults follow docs/architecture/overview.md: at least three replicas
# spread across zones, a PodDisruptionBudget, rolling updates that never
# reduce capacity, and a termination grace period long enough for streamed
# completions to finish.

replicaCount: 3

image:
  repository: ghcr.io/getstratum/stratum-gateway
  # Defaults to the chart's appVersion.
  tag: ""
  # Prefer pinning by digest in production: sha256:...
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Where the gateway gets its configuration: "controlPlane" or "static".
mode: controlPlane

controlPlane:
  # https URL of the Stratum control plane.
  url: ""
  # Plain http is refused unless this is true (development only).
  allowHTTP: false
  syncInterval: 30s
  fullResyncInterval: 10m

static:
  # Standalone mode: the sync-format JSON configuration, inline.
  # Provider keys can reference environment variables ("env:OPENAI_API_KEY")
  # supplied through extraEnvFrom.
  config: ""
  # Or use an existing ConfigMap with a "stratum.json" key.
  existingConfigMap: ""

# Secret with the gateway's credentials. Create it yourself (or with your
# secret manager) and reference it here; the chart never renders secrets.
#   STRATUM_SYNC_TOKEN    (control plane mode)
#   STRATUM_INSTANCE_ID   (control plane mode)
#   STRATUM_SNAPSHOT_KEY  64 hex chars, enables the encrypted snapshot on disk
#                         and, with Valkey, its shared copy (snapshot.shared)
existingSecret: ""

snapshot:
  # Size of the emptyDir that holds the encrypted snapshot on each pod.
  sizeLimit: 64Mi
  # Keep an encrypted copy of the snapshot in Valkey (docs/adr/0008), so a pod
  # that starts while the control plane is unreachable can still serve. On
  # when quota.valkey.url (or STRATUM_VALKEY_URL) and STRATUM_SNAPSHOT_KEY are
  # set. Without it, such a pod stays unready until the control plane returns.
  shared: true
  # How long a starting pod waits for the control plane before it uses the
  # copy in Valkey. In normal operation pods start from the control plane.
  bootstrapTimeout: 10s

gateway:
  maxInflight: 1024
  maxRequestBytes: 10485760
  upstreamHeaderTimeout: 120s
  streamIdleTimeout: 60s
  piiEnabled: true
  corsAllowedOrigins: ""
  logLevel: info

# Shared monthly token quotas across replicas (docs/adr/0004). Valkey is never
# on the request path: a Valkey outage does not fail requests in the default
# fail mode. Without it each replica counts on its own, so a team can spend up
# to <replicas> times its quota.
quota:
  valkey:
    # redis://host:6379/0, or rediss:// for TLS. Keep the password out of the
    # URL and put STRATUM_VALKEY_PASSWORD in existingSecret, or leave this
    # empty and put the whole STRATUM_VALKEY_URL in existingSecret.
    url: ""
    keyPrefix: stratum
    # With rediss:// and a private CA: a ConfigMap whose key ca.crt holds
    # the CA certificates (PEM) to trust instead of the system roots.
    caConfigMap: ""
  syncInterval: 1s
  staleAfter: 30s
  # open: keep enforcing with last known totals while Valkey is down.
  # closed: reject requests of teams with a quota (503) while it is down.
  failMode: open

# Graceful shutdown. Readiness fails first, the load balancer stops routing,
# then in-flight requests (including long streams) get up to
# shutdownTimeoutSeconds to finish. The pod's termination grace period is
# derived from these values (drain + shutdown + 30 s). Some platforms cap it:
# GKE Autopilot allows at most 600 s, so keep drain + shutdown <= 570 there
# (deploy/gcp uses 45 + 520).
lifecycle:
  drainDelaySeconds: 10
  shutdownTimeoutSeconds: 600

extraEnv: []
extraEnvFrom: []

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    memory: 256Mi

service:
  type: ClusterIP
  port: 80
  annotations: {}

metrics:
  # Separate ClusterIP service for /metrics on the admin port.
  enabled: true
  port: 9090
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    labels: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

# Spread replicas across zones and nodes. With "DoNotSchedule" a replica
# stays pending rather than landing in a zone that already has one too many;
# use "ScheduleAnyway" on single-zone clusters.
topologySpread:
  enabled: true
  zoneWhenUnsatisfiable: DoNotSchedule
  hostWhenUnsatisfiable: ScheduleAnyway

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
