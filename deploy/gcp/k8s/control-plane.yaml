# Control plane (Next.js) — target 99.9%, not on the gateway's request path.
# Two stateless replicas in different zones; PostgreSQL through the Cloud
# SQL Auth Proxy running as a native sidecar (mTLS + IAM, private IP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratum-control-plane
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: stratum-control-plane
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: stratum-control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stratum-control-plane
    spec:
      serviceAccountName: stratum-control-plane
      # Workload Identity is served by the GKE metadata server; the pod
      # does not need a Kubernetes API token.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stratum-control-plane
      initContainers:
        - name: cloud-sql-proxy
          image: ${PROXY_IMAGE}
          restartPolicy: Always # native sidecar: starts first, stops last
          args:
            - --private-ip
            - --structured-logs
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - --exit-zero-on-sigterm
            - ${SQL_CONNECTION_NAME}
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /liveness
              port: 9801
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: control-plane
          image: ${CP_IMAGE}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SECURE_COOKIES
              value: "true"
            # The Google load balancer appends the client and its own address
            # to X-Forwarded-For: the client is the second entry from the right.
            - name: STRATUM_TRUSTED_PROXY_HOPS
              value: "2"
            # Keep-alive longer than the load balancer's (600 s), so the
            # server never closes a connection the LB is about to reuse.
            - name: KEEP_ALIVE_TIMEOUT
              value: "620000"
            - name: GATEWAY_INTERNAL_URL
              value: http://stratum-gateway.${NAMESPACE}.svc
          envFrom:
            - secretRef:
                name: stratum-control-plane # DATABASE_URL, STRATUM_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Let the load balancer stop routing before the server exits.
            preStop:
              sleep:
                seconds: 15
          resources:
            requests:
              cpu: 450m
              memory: 960Mi
            limits:
              memory: 960Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stratum-control-plane
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: stratum-control-plane
---
# Two Services over the same pods so the load balancer gets two backend
# services with different Cloud Armor policies (console vs. sync).
apiVersion: v1
kind: Service
metadata:
  name: stratum-cp-console
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: stratum-control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: stratum-cp-sync
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: stratum-control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
