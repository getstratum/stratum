# OpenAI-compatible mock provider for load and failure tests: no tokens are
# billed by a real provider. Registered in the control plane as provider
# "ollama" (OpenAI wire protocol), so clients call model "ollama/mock-1".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: mock-llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mock-llm
      containers:
        - name: mock-llm
          image: ${MOCK_IMAGE}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MOCK_LATENCY_MS
              value: "300"
            - name: MOCK_STREAM_CHUNKS
              value: "20"
            - name: MOCK_CHUNK_INTERVAL_MS
              value: "100"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 8080
      targetPort: http
