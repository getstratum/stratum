# Default deny for ingress; each component admits only who needs it.
# 35.191.0.0/16 and 130.211.0.0/22 are Google's load balancer proxies and
# health checkers. Probes from the kubelet are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stratum-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock: { cidr: 35.191.0.0/16 }
        - ipBlock: { cidr: 130.211.0.0/22 }
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stratum-control-plane
      ports:
        - port: 20128
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["gmp-system", "gke-gmp-system"]
      ports:
        - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stratum-control-plane
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock: { cidr: 35.191.0.0/16 }
        - ipBlock: { cidr: 130.211.0.0/22 }
        # In-cluster sync, used while the TLS certificate is not issued yet.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stratum-gateway
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-llm
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stratum-gateway
      ports:
        - port: 8080
